    note(){if(!this.ctx||this.muted)return;const now=this.ctx.currentTime,f=this.melody[this.noteIndex++%this.melody.length],o=this.ctx.createOscillator(),harm=this.ctx.createOscillator(),g=this.ctx.createGain(),filter=this.ctx.createBiquadFilter(),pan=this.ctx.createStereoPanner();o.type='triangle';o.frequency.setValueAtTime(f,now);harm.type='sine';harm.frequency.setValueAtTime(f*2,now);filter.type='lowpass';filter.frequency.value=1350;pan.pan.value=this.noteIndex%2?.28:-.28;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.15,now+.04);g.gain.exponentialRampToValueAtTime(.0001,now+2.8);o.connect(filter);harm.connect(filter);filter.connect(g);g.connect(pan);pan.connect(this.master);g.connect(this.echo);o.start(now);harm.start(now);o.stop(now+2.9);harm.stop(now+2.9)}
    changeChord(){if(!this.nodes.length)return;this.chordIndex=(this.chordIndex+1)%this.chords.length;this.nodes.forEach((o,i)=>o.frequency.setTargetAtTime(this.chords[this.chordIndex][i],this.ctx.currentTime,2.2))}

    toggle(){if(!this.active){this.start();return}this.muted=!this.muted;this.master.gain.setTargetAtTime(this.muted?.0001:.34,this.ctx.currentTime,.18);if(!this.muted)this.ctx.resume();$('#soundLabel').textContent=this.muted?'Activar música':'Silenciar';$('#sound').setAttribute('aria-label',this.muted?'Activar música':'Silenciar música')}
  }  audio=new Ambient();$('#start').addEventListener('click',start);next.addEventListener('click',advance);$('#sound').addEventListener('click',()=>audio.toggle());addEventListener('resize',size);addEventListener('keydown',e=>{if(e.key==='Enter'&&started&&!final&&!next.hidden)advance()});addEventListener('pointerdown',e=>{if(started&&!final&&!next.hidden&&e.target===canvas)advance()});size();requestAnimationFrame(drawSky);
